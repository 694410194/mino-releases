name: mac-build
# Mino macOS unsigned 发布构建——mino-deploy scripts/build-win-x64-release.sh 的 macOS 对应物。
# 本仓（mino-releases）= 桌面端构建+发布的唯一收口：公仓吃免费 runner；产品源码不公开——
# deploy key（mino-agent 仓只读部署密钥）checkout 私仓备份（BASE + format-patch），
# 再与公开上游重建产品树。secrets 只存私钥，日志全程掩码。
# 环境口径与 win 一致：ELECTRON_MIRROR / DSH_DESKTOP_UPDATE_CHANNEL=stable / MINO_PLUGINS_DIR。
# .env.macos 由 workflow 内联写入（无非密）：baby.mino.desktop appId + production
# 更新面——产物是 Mino 品牌 unsigned 包（dmg 下载用 + zip 更新用 + stable-mac.yml feed）。

on:
  workflow_dispatch:
    inputs:
      plugins_ref:
        description: 'mino-plugins ref（分支或 commit）'
        required: false
        default: 'main'
      publish:
        description: '构建后把资产上传 v<version> release（同名覆盖）'
        required: false
        type: boolean
        default: false
      version:
        description: '发布版本号（publish 时必填，须与产物版本一致）'
        required: false
        default: ''

jobs:
  mac-arm64-unsigned:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
      DSH_DESKTOP_UPDATE_CHANNEL: 'stable'
    steps:
      - name: checkout product backup (deploy key)
        uses: actions/checkout@v4
        with:
          repository: 694410194/mino-agent
          ssh-key: ${{ secrets.MAC_BUILD_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.MAC_BUILD_KNOWN_HOSTS }}
          path: backup

      - name: reconstruct product source (BASE + format-patch)
        run: |
          set -e
          BASE=$(cat backup/BASE)
          mkdir src && cd src
          git init -q .
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --depth=1 -q upstream "$BASE"
          git checkout -q FETCH_HEAD
          git -c user.name=wuyangji -c user.email=694410194@qq.com am -q ../backup/patches/*.patch
          git remote add fork https://github.com/694410194/mino-agent.git
          echo "reconstructed: $(git log -1 --format='%h %s') | $(git ls-files | wc -l | tr -d ' ') files"

      - name: checkout mino-plugins
        uses: actions/checkout@v4
        with:
          repository: 694410194/mino-plugins
          ref: ${{ inputs.plugins_ref }}
          path: mino-plugins

      - uses: pnpm/action-setup@v4
        with:
          # 钉死 v11：lockfile 口径与仓根 packageManager 一致；v12 会静默跳过重算
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            src/pnpm-lock.yaml
            mino-plugins/pnpm-lock.yaml

      - name: install workspace deps
        run: |
          set -e
          pnpm --dir src install --frozen-lockfile
          pnpm --dir mino-plugins install --frozen-lockfile

      - name: apply esbuild stdin patch
        run: |
          cd src
          n=0
          for f in node_modules/.pnpm/esbuild@*/node_modules/esbuild/lib/main.js; do
            [ -f "$f" ] || continue
            sed -i '' 's/input\.length > 1024 \* 1024)/input.length > 1024 * 1024 * 1024)/' "$f" && n=$((n+1))
          done
          echo "esbuild patched: $n file(s)"
          [ "$n" -gt 0 ]

      - name: write .env.macos (non-secret release config)
        # 有了 .env.macos，unsigned 构建走 loadDesktopPackageEnvironment：
        # baby.mino.desktop appId + production 更新面（feed 嵌入 zip 产物）。
        run: |
          printf '%s\n' \
            'DSH_DESKTOP_APP_ID=baby.mino.desktop' \
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production' \
            'DOWNLOAD_TEST_ORIGIN=' \
            'DOWNLOAD_TEST_RELEASE_ID=' \
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://mino.baby' \
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://mino.baby' \
            "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{}'" \
            'DSH_DESKTOP_MACOS_PACK_CONCURRENCY=4' \
            'DSH_DESKTOP_MACOS_ZIP_COMPRESSION_LEVEL=3' \
            > src/apps/desktop/.env.macos

      - name: render macOS icon at 1024
        # electron-builder mac 闸门 ≥512px；备份仓 patch 尚未带 1024 重渲染版，
        # 此处从 resources/icon-macos.svg 矢真理现渲，备份同步后此步自然幂等。
        working-directory: src/apps/desktop
        run: |
          node -e "import('sharp').then(async ({default:sharp})=>{const fs=await import('fs');const svg=fs.readFileSync('resources/icon-macos.svg');await sharp(svg,{density:72}).resize(1024,1024).png().toFile('resources/icon-macos.png');const b=fs.readFileSync('resources/icon-macos.png');console.log('icon-macos.png',b.readUInt32BE(16)+'x'+b.readUInt32BE(20));if(b.readUInt32BE(16)<512)process.exit(1)})"

      - name: package mac-arm64 unsigned
        working-directory: src
        env:
          MINO_PLUGINS_DIR: ${{ github.workspace }}/mino-plugins
        run: pnpm --dir apps/desktop run package:mac:arm64:unsigned

      - name: verify artifacts
        working-directory: src
        run: |
          ART=apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts
          ls -lh "$ART"
          ls "$ART"/*.dmg "$ART"/*.zip "$ART"/*.blockmap "$ART"/stable-mac.yml >/dev/null || { echo "artifacts incomplete in $ART"; exit 1; }
          grep -q '^version: ' "$ART"/stable-mac.yml || { echo "stable-mac.yml malformed"; exit 1; }
          # feed URL 嵌在 app 内的 app-update.yml，不在通道清单里
          unzip -p "$ART"/*.zip 'Mino.app/Contents/Resources/app-update.yml' 2>/dev/null \
            | grep -q 'download.mino.baby/dsh-desk/feeds/mac-arm64' \
            || { echo "app-update.yml missing production feed"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: mino-mac-arm64-unsigned-${{ github.run_id }}
          path: src/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*
          retention-days: 30
          if-no-files-found: error

  publish:
    # 发布 = 构建产物改名进本仓 v<version> release。同仓 GITHUB_TOKEN 直传，零跨仓凭据。
    # dmg 按官网约定改名 Mino-Setup-<v>.dmg；zip/blockmap/通道 yml 保构建名（yml 内部互引）。
    if: inputs.publish
    needs: mac-arm64-unsigned
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mino-mac-arm64-unsigned-${{ github.run_id }}
          path: dist

      - name: stage release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          [ -n "$VERSION" ] || { echo "publish requires version input"; exit 1; }
          grep -qx "version: $VERSION" dist/stable-mac.yml \
            || { echo "stable-mac.yml 版本与输入不符，拒绝发布"; cat dist/stable-mac.yml; exit 1; }
          mkdir rel
          cp dist/*.dmg "rel/Mino-Setup-${VERSION}.dmg"
          cp dist/*.zip dist/*.blockmap dist/stable-mac.yml rel/
          cp dist/stable-mac.yml rel/nightly-mac.yml
          ls -lh rel

      - name: upload assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "Mino $VERSION" --notes "Mino $VERSION 桌面安装包"
          declare -A WANT=()
          for f in rel/*; do WANT["$(basename "$f")"]=$(sha256sum "$f" | cut -d' ' -f1); done
          for f in rel/*; do gh release upload "$TAG" "$f" --clobber; done
          sleep 5
          REL_ID=$(gh api "repos/${{ github.repository }}/releases?per_page=30" \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id")
          for name in "${!WANT[@]}"; do
            got=$(gh api "repos/${{ github.repository }}/releases/$REL_ID" \
              --jq ".assets[] | select(.name==\"$name\") | .digest" | sed 's/sha256://')
            [ "$got" = "${WANT[$name]}" ] || { echo "digest mismatch: $name"; exit 1; }
          done
          gh release edit "$TAG" --draft=false

      - name: push release assets to COS and purge feed cache
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COSCLI_SHA256: a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915
        run: |
          set -euo pipefail
          # coscli 与服务器同版同哈希（tencentyun/coscli 官方 v1.0.9 linux-amd64）。
          curl -fsSL -o /tmp/coscli \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          echo "$COSCLI_SHA256  /tmp/coscli" | sha256sum -c -
          install -m 755 /tmp/coscli /usr/local/bin/coscli
          COS=(coscli --disable-log -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" -e "cos.$COS_REGION.myqcloud.com")
          B="cos://$COS_BUCKET"
          # release.mac.json：下载页运行时版本指针（version/file/size/sha256），
          # 先挂进 release 资产——本地镜像兜底随之获得它，且计入 EXPECT 不被清理。
          F="rel/Mino-Setup-$VERSION.dmg"
          printf '{\n  "version": "%s",\n  "file": "%s",\n  "size": %s,\n  "sha256": "%s"\n}\n' \
            "$VERSION" "$(basename "$F")" "$(stat -c%s "$F")" \
            "$(sha256sum "$F" | cut -d" " -f1)" > "rel/release.mac.json"
          gh release upload "v$VERSION" "rel/release.mac.json" --clobber \
            --repo ${{ github.repository }}
          # 键映射与 mino-deploy sync-release-assets.sh 的 cos_keys_for 一致：
          # feeds/<platform>/ 给更新器，desktop/ 给官网按钮。
          cos_keys_for() {
            case "$1" in
              stable.yml)        echo "dsh-desk/feeds/win-x64/stable.yml dsh-desk/feeds/win-x64/latest.yml" ;;
              nightly.yml)       echo "dsh-desk/feeds/win-x64/nightly.yml" ;;
              stable-mac.yml)    echo "dsh-desk/feeds/mac-arm64/stable-mac.yml dsh-desk/feeds/mac-arm64/latest-mac.yml" ;;
              nightly-mac.yml)   echo "dsh-desk/feeds/mac-arm64/nightly-mac.yml" ;;
              Mino-Setup-*.dmg)  echo "desktop/$1" ;;
              Mino-Setup-*)      echo "dsh-desk/feeds/win-x64/$1 desktop/$1" ;;
              *-mac-arm64-*)     echo "dsh-desk/feeds/mac-arm64/$1" ;;
              release.*.json)    echo "desktop/$1" ;;
              *)                 return 1 ;;
            esac
          }
          # 期望键集按整份 release 资产算（本 workflow 的 rel/ 只有本平台一半，
          # 按 rel/ 算会把另一平台的键当过期对象删掉）。
          declare -A EXPECT
          while IFS= read -r a; do
            keys=$(cos_keys_for "$a") || continue
            for k in $keys; do EXPECT["$k"]=1; done
          done < <(gh release view "v$VERSION" --repo ${{ github.repository }} --json assets \
            --jq '.assets[].name')
          # 二进制先推、通道 yml 最后推——更新器永远读不到指向缺失二进制的 feed。
          for f in rel/*; do
            base=$(basename "$f")
            [[ "$base" == *.yml ]] && continue
            cos_keys_for "$base" >/dev/null || { echo "推桶跳过 $base"; continue; }
            for k in $(cos_keys_for "$base"); do
              "${COS[@]}" cp "$f" "$B/$k" >/dev/null
              echo "cos <- $k"
            done
          done
          for f in rel/*.yml; do
            base=$(basename "$f")
            cos_keys_for "$base" >/dev/null || { echo "推桶跳过 $base"; continue; }
            for k in $(cos_keys_for "$base"); do
              "${COS[@]}" cp "$f" "$B/$k" >/dev/null
              echo "cos <- $k"
            done
          done
          # 远端清理：删不在本版键集的对象（上一版安装包），沿用 MAX_PRUNE 闸。
          MAX_PRUNE=10
          RPRUNE=()
          while IFS= read -r obj; do
            [ -z "$obj" ] && continue
            [ -z "${EXPECT[$obj]:-}" ] && RPRUNE+=("$obj")
          done < <("${COS[@]}" ls "$B/" -r \
            | awk -F'|' '/\| FILE \|/ {gsub(/^ +| +$/,"",$1); print $1}')
          if (( ${#RPRUNE[@]} > MAX_PRUNE )); then
            echo "桶内过期对象数 ${#RPRUNE[@]} 超过 MAX_PRUNE=$MAX_PRUNE，未删除：" >&2
            printf '  %s\n' "${RPRUNE[@]}" >&2
            exit 1
          fi
          for obj in "${RPRUNE[@]}"; do
            "${COS[@]}" rm "$B/$obj" -f >/dev/null || true
            echo "cos rm $obj"
          done
          # feeds 边缘缓存不随 1s TTL 可靠过期（v0.2.10 实测整组停在 0.2.9）——必须主动刷。
          python3 -m pip install -q "tccli==3.1.200.1"
          tccli configure set secretId "$COS_SECRET_ID" secretKey "$COS_SECRET_KEY" region "$COS_REGION" >/dev/null
          URLS=$(printf '"https://download.mino.baby/%s",' "${!EXPECT[@]}" | sed 's/,$//')
          tccli cdn PurgeUrlsCache --Urls "[$URLS]"
          echo "COS push done: ${#EXPECT[@]} keys, ${#RPRUNE[@]} pruned"
